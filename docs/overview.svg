<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4dff88"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fa58a"/>
    </marker>
  </defs>

  <rect width="1280" height="600" rx="28" fill="#06100a"/>
  <rect x="1" y="1" width="1278" height="598" rx="27" fill="none" stroke="#1b3524"/>

  <!-- title -->
  <text x="60" y="78" fill="#4dff88" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="700" letter-spacing="7">GLASS<tspan fill="#d3f7dc" font-weight="400"> DESKTOP</tspan></text>
  <text x="60" y="112" fill="#8fb89a" font-size="19">Your Windows PC on MemoMind One smart glasses — screen, sound, mouse &amp; keyboard, from anywhere.</text>

  <!-- ===== PC ===== -->
  <g transform="translate(60,170)">
    <rect width="330" height="210" rx="12" fill="#18261d" stroke="#2c4a36"/>
    <rect x="12" y="12" width="306" height="172" rx="4" fill="#dfe7e2"/>
    <!-- windows -->
    <rect x="24" y="24" width="170" height="112" rx="4" fill="#fff" stroke="#b7c4bb"/>
    <rect x="24" y="24" width="170" height="16" rx="4" fill="#9fb3a6"/>
    <g fill="#55665b">
      <rect x="34" y="50" width="140" height="6" rx="3"/><rect x="34" y="64" width="120" height="6" rx="3"/>
      <rect x="34" y="78" width="148" height="6" rx="3"/><rect x="34" y="92" width="100" height="6" rx="3"/>
      <rect x="34" y="106" width="130" height="6" rx="3"/><rect x="34" y="120" width="90" height="6" rx="3"/>
    </g>
    <rect x="206" y="44" width="100" height="78" rx="4" fill="#fff" stroke="#b7c4bb"/>
    <rect x="206" y="44" width="100" height="14" rx="4" fill="#9fb3a6"/>
    <circle cx="256" cy="92" r="20" fill="#c4d2c8"/>
    <rect x="12" y="170" width="306" height="14" fill="#9fb3a6"/>
    <path d="M150 100 l0 18 l5 -5 l4 9 l3 -1 l-4 -9 l7 0 z" fill="#111" stroke="#fff" stroke-width="1"/>
    <rect x="140" y="210" width="50" height="26" fill="#18261d"/>
    <rect x="105" y="234" width="120" height="10" rx="5" fill="#18261d"/>
    <text x="165" y="282" text-anchor="middle" fill="#d3f7dc" font-size="20" font-weight="600">Windows PC</text>
    <text x="165" y="306" text-anchor="middle" fill="#7fa58a" font-family="Consolas, Menlo, monospace" font-size="15">glass_stream.py</text>
  </g>

  <!-- arrows PC <-> phone -->
  <g font-size="14">
    <line x1="405" y1="250" x2="545" y2="250" stroke="#4dff88" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="475" y="238" text-anchor="middle" fill="#4dff88">screen + sound</text>
    <line x1="545" y1="300" x2="405" y2="300" stroke="#7fa58a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahd)"/>
    <text x="475" y="324" text-anchor="middle" fill="#7fa58a">mouse + keys</text>
    <g transform="translate(463,345)">
      <rect x="0" y="9" width="24" height="18" rx="3" fill="none" stroke="#d3f7dc" stroke-width="2"/>
      <path d="M5 9 v-4 a7 7 0 0 1 14 0 v4" fill="none" stroke="#d3f7dc" stroke-width="2"/>
    </g>
    <text x="475" y="394" text-anchor="middle" fill="#d3f7dc" font-size="16" font-weight="600">Tailscale</text>
    <text x="475" y="414" text-anchor="middle" fill="#7fa58a" font-size="13">private, from anywhere</text>
  </g>

  <!-- ===== PHONE ===== -->
  <g transform="translate(560,140)">
    <rect width="160" height="300" rx="22" fill="#111c15" stroke="#2c4a36" stroke-width="2"/>
    <rect x="10" y="14" width="140" height="272" rx="14" fill="#0a150e"/>
    <text x="80" y="38" text-anchor="middle" fill="#4dff88" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2">GLASS DESKTOP</text>
    <g font-family="Consolas, Menlo, monospace" text-anchor="middle">
      <rect x="18" y="48" width="38" height="26" rx="5" fill="#13241a"/><text x="37" y="66" fill="#4dff88" font-size="12">8.4</text>
      <rect x="61" y="48" width="38" height="26" rx="5" fill="#13241a"/><text x="80" y="66" fill="#4dff88" font-size="12">22</text>
      <rect x="104" y="48" width="38" height="26" rx="5" fill="#13241a"/><text x="123" y="66" fill="#4dff88" font-size="11">♪ on</text>
    </g>
    <rect x="18" y="82" width="124" height="112" rx="10" fill="#0d2015" stroke="#2c4a36"/>
    <text x="80" y="134" text-anchor="middle" fill="#6e9a7a" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2">TRACKPAD</text>
    <circle cx="96" cy="160" r="9" fill="#4dff88" opacity="0.35"/>
    <path d="M70 168 q14 -10 26 -8" fill="none" stroke="#4dff88" stroke-width="2" opacity="0.6"/>
    <g fill="#13241a" stroke="#1b3524">
      <rect x="18" y="202" width="38" height="18" rx="4"/><rect x="61" y="202" width="38" height="18" rx="4"/><rect x="104" y="202" width="38" height="18" rx="4"/>
      <rect x="18" y="226" width="124" height="20" rx="4"/>
      <rect x="18" y="252" width="27" height="16" rx="3"/><rect x="50" y="252" width="27" height="16" rx="3"/>
      <rect x="83" y="252" width="27" height="16" rx="3"/><rect x="115" y="252" width="27" height="16" rx="3"/>
    </g>
    <text x="80" y="240" text-anchor="middle" fill="#6e9a7a" font-size="9">type on the PC…</text>
    <text x="80" y="334" text-anchor="middle" fill="#d3f7dc" font-size="20" font-weight="600">Phone</text>
    <text x="80" y="358" text-anchor="middle" fill="#7fa58a" font-size="15">MemoMind app plugin</text>
  </g>

  <!-- arrow phone -> glasses -->
  <g font-size="14">
    <line x1="735" y1="275" x2="845" y2="275" stroke="#4dff88" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="790" y="263" text-anchor="middle" fill="#4dff88">frames</text>
    <text x="790" y="299" text-anchor="middle" fill="#d3f7dc" font-size="16" font-weight="600">Bluetooth</text>
    <text x="790" y="318" text-anchor="middle" fill="#7fa58a" font-size="13">picture + sound</text>
  </g>

  <!-- ===== GLASSES VIEW ===== -->
  <g transform="translate(862,150)">
    <rect width="360" height="210" rx="10" fill="#020604" stroke="#1f3a28"/>
    <g filter="url(#glow)" fill="none" stroke="#4dff88">
      <rect x="22" y="20" width="200" height="146" rx="3" stroke-width="1.6"/>
      <line x1="22" y1="38" x2="222" y2="38" stroke-width="1.6"/>
      <rect x="236" y="44" width="104" height="80" rx="3" stroke-width="1.6"/>
      <circle cx="288" cy="88" r="20" stroke-width="1.4" opacity="0.7"/>
    </g>
    <g filter="url(#glow)" fill="#4dff88">
      <rect x="34" y="52" width="160" height="5" rx="2.5"/><rect x="34" y="66" width="136" height="5" rx="2.5" opacity="0.85"/>
      <rect x="34" y="80" width="170" height="5" rx="2.5"/><rect x="34" y="94" width="112" height="5" rx="2.5" opacity="0.85"/>
      <rect x="34" y="108" width="150" height="5" rx="2.5"/><rect x="34" y="122" width="96" height="5" rx="2.5" opacity="0.85"/>
      <rect x="34" y="136" width="140" height="5" rx="2.5"/>
      <rect x="22" y="182" width="318" height="3" rx="1.5" opacity="0.5"/>
      <path d="M160 112 l0 18 l5 -5 l4 9 l3 -1 l-4 -9 l7 0 z"/>
    </g>
    <text x="180" y="244" text-anchor="middle" fill="#7fa58a" font-size="13">what you see in the glasses: 600×350 green HUD</text>
  </g>

  <!-- glasses outline -->
  <g transform="translate(925,404)" fill="none" stroke="#d3f7dc" stroke-width="3" stroke-linejoin="round">
    <path d="M10 18 h88 a6 6 0 0 1 6 6 v18 a24 24 0 0 1 -24 24 h-46 a24 24 0 0 1 -24 -24 v-18 a6 6 0 0 1 6 -6 z" fill="#0b1a10"/>
    <path d="M134 18 h88 a6 6 0 0 1 6 6 v18 a24 24 0 0 1 -24 24 h-46 a24 24 0 0 1 -24 -24 v-18 a6 6 0 0 1 6 -6 z" fill="#0b1a10"/>
    <path d="M104 26 q15 -10 30 0"/>
    <path d="M4 22 l-30 -6"/><path d="M228 22 l30 -6"/>
    <rect x="30" y="32" width="46" height="14" rx="2" stroke="#4dff88" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="156" y="32" width="46" height="14" rx="2" stroke="#4dff88" stroke-width="1.5" filter="url(#glow)"/>
  </g>
  <text x="1042" y="502" text-anchor="middle" fill="#d3f7dc" font-size="20" font-weight="600">MemoMind One</text>

  <!-- feature chips -->
  <g font-size="14" fill="#d3f7dc" text-anchor="middle">
    <g transform="translate(60,520)">
      <rect width="130" height="34" rx="17" fill="#0d1a12" stroke="#2c4a36"/><text x="65" y="22">Live screen</text>
      <rect x="142" width="120" height="34" rx="17" fill="#0d1a12" stroke="#2c4a36"/><text x="202" y="22">PC sound</text>
      <rect x="274" width="190" height="34" rx="17" fill="#0d1a12" stroke="#2c4a36"/><text x="369" y="22">Trackpad &amp; keyboard</text>
      <rect x="476" width="200" height="34" rx="17" fill="#0d1a12" stroke="#2c4a36"/><text x="576" y="22">Zoom around the mouse</text>
      <rect x="688" width="160" height="34" rx="17" fill="#0d1a12" stroke="#2c4a36"/><text x="768" y="22">Monitors off</text>
    </g>
  </g>
</svg>
